[package]
name = "bench-async-openai"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
async-openai = { version = "=0.42.0", features = ["chat-completion"] }
[profile.release]
opt-level = 3
lto = false
codegen-units = 1
debug = 0
strip = "symbols"
