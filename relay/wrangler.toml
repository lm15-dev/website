# The lm15 playground relay (relay/worker.js). Deploy: `npx wrangler deploy`
# from this folder after `npx wrangler login` — one Cloudflare account, free
# tier (100,000 requests/day). The Worker gets a `*.workers.dev` address;
# put it in `src/playground/relay.ts` (RELAY_URL). A custom name such as
# `relay.lm15.dev` needs the lm15.dev DNS zone on Cloudflare (it is at
# GoDaddy today), so the workers.dev address is used as is.
name = "lm15-relay"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# No request logs: the relay carries users' provider keys and prompts.
[observability]
enabled = false
[observability.logs]
enabled = false

[vars]
# Comma-separated. Every other upstream and origin is refused by name.
# An upstream is a host (every path) or host/path (that path; a trailing / allows the paths under it).
# Beyond TypeSafe, these are the sign-in and model endpoints lm15-contract auth/managed/browser.json
# found closed to web pages (2026-09-24); the page asks before using any of them.
ALLOWED_UPSTREAMS = "api.typesafe.ai,auth.x.ai/oauth2/device/code,auth.x.ai/oauth2/token,platform.claude.com/v1/oauth/token,github.com/login/device/code,github.com/login/oauth/access_token,api.github.com/copilot_internal/v2/token,auth.meta.com/oidc/device/authorization/,auth.meta.com/oidc/device/token/,api.meta.ai/muse-code/key,chatgpt.com/backend-api/codex/,api.kimi.com/coding/"
ALLOWED_ORIGINS = "https://lm15.dev,https://www.lm15.dev"
