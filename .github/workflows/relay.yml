name: Deploy the playground relay
# relay/README.md. Runs when relay/ changes on main, or by hand. Needs two
# repository secrets: CLOUDFLARE_API_TOKEN (token template "Edit Cloudflare
# Workers") and CLOUDFLARE_ACCOUNT_ID. Nothing else on the site depends on it.
on:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-deploy
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Test the Worker in Node
        run: node --test relay/worker.test.js
      - name: Deploy
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; see relay/README.md"; exit 1
          fi
          cd relay
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1 > address.txt
          echo "Relay address: $(cat address.txt)"
